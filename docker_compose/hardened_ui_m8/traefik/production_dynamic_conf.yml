# production_dynamic_conf.yml — Production
#
# Used two ways:
#   1. Mounted directly by docker-compose.production.yml (the thin production
#      overlay) in place of dynamic_conf.yml — no copy needed.
#   2. Or copy to dynamic_conf.yml when deploying without the overlay.
#
# Changes from the dev config (traefik/dynamic_conf.yml):
#   1. TLS floor raised to VersionTLS13 (drop to VersionTLS12 with the cipherSuites
#      below only if you must support older clients).
#   2. Host rules use real FQDNs (auth.example.com / media.example.com) instead of
#      localhost. Replace the example FQDNs with your domain. The app ALSO enforces
#      these via ALLOWED_HOSTS (TrustedHostMiddleware) — proxy host rules are
#      defense-in-depth; the app-layer guard is the primary control.
#   3. security-headers-prod is ready for HSTS + a full Content-Security-Policy
#      (both commented — opt in only on a TLS-stable public host).
#   4. Update the TLS section to use your real certificate paths or an ACME resolver.
#
# TOPOLOGY: the routers below expose BOTH /user and /media over HTTPS (Case B —
# external clients, e.g. the fa-ui front end / a browser extension calling the
# services directly). For the more closed Case A (UI-only / gateway-only), DELETE
# the media-public-router so the media service is reachable only on the Docker
# network. Either way the SECURITY CONTRACT path exclusions stay (see below).
#
# HSTS WARNING: once enabled, browsers refuse plain HTTP to this host for
# stsSeconds — even after you disable it. Only enable after TLS is stable and
# trusted.
tls:
  # options.default is applied automatically to every router that does not name
  # an explicit tls.options. Production raises the floor to TLS 1.3.
  options:
    default:
      minVersion: VersionTLS13
      cipherSuites:                    # only consulted for TLS 1.2 fallback; TLS 1.3 suites are fixed
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - X25519
        - CurveP256
  stores:
    default:
      defaultCertificate:
        certFile: "/etc/traefik/certs/local.crt"
        keyFile:  "/etc/traefik/certs/local.key"
  certificates:
    - certFile: "/etc/traefik/certs/local.crt"
      keyFile:  "/etc/traefik/certs/local.key"
http:

  routers:
    # Dashboard — localhost only: served on the built-in 'traefik' entrypoint
    # (127.0.0.1:8080), Host-pinned and IP-restricted, over TLS.
    # api.insecure is false, so this router is the ONLY way to reach api@internal.
    traefik-dashboard:
      entryPoints:
        - traefik
      rule: "Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      service: api@internal
      middlewares:
        - ip-allowlist
      tls: {}

    # Auth-User-Service: public routes on HTTPS.
    # PRODUCTION: docs are disabled via ENVIRONMENT=production — no CSP/docs conflict.
    # SECURITY CONTRACT — the paths below are NEVER routed from the public internet:
    #   /user/health   — internal readiness probe only
    #   /user/metrics  — Prometheus scrape endpoint, internal only
    #   /user/private  — inter-service API; the app also requires X-Internal-Token,
    #                    but Traefik must block it first so the route is invisible.
    auth-public-router:
      entryPoints:
        - websecure
      # Pinned to the real FQDN — replace auth.example.com with your domain.
      # Deleting the `Host(...) && ` prefix matches any hostname/IP (not advised).
      # The path exclusions are the SECURITY CONTRACT and MUST stay regardless.
      rule: "Host(`auth.example.com`) && PathPrefix(`/user`) && !(PathPrefix(`/user/health`) || PathPrefix(`/user/metrics`) || PathPrefix(`/user/private`))"
      service: auth-service
      middlewares:
        - security-headers-prod
      tls: {}
      priority: 2

    # Auth-User-Service: all routes on the localhost-bound api entryPoint (port 9000)
    auth-internal-router:
      entryPoints:
        - api
      rule: "PathPrefix(`/user`)"
      service: auth-service
      middlewares:
        - security-headers-prod
        - internal-only

    # Media-Service: public routes on HTTPS (Case B). For Case A (UI-only / gateway-
    # only), DELETE this router so the media service is reachable only on the Docker
    # network.
    # SECURITY CONTRACT — the paths below are NEVER routed from the public internet:
    #   /media/health  — internal readiness probe only
    #   /media/metrics — Prometheus scrape endpoint, internal only
    media-public-router:
      entryPoints:
        - websecure
      # Pinned to the real FQDN — replace media.example.com with your domain.
      # The path exclusions are the SECURITY CONTRACT and MUST stay regardless.
      rule: "Host(`media.example.com`) && PathPrefix(`/media`) && !(PathPrefix(`/media/health`) || PathPrefix(`/media/metrics`))"
      service: media-service
      middlewares:
        - security-headers-prod
      tls: {}

    # Media-Service: all routes on the localhost-bound api entryPoint (port 9000)
    media-internal-router:
      entryPoints:
        - api
      rule: "PathPrefix(`/media`)"
      service: media-service
      middlewares:
        - security-headers-prod
        - internal-only

    # MinIO S3 data-path: browser-direct presigned uploads/downloads over TLS.
    # SECURITY CONTRACT:
    #   - Only the S3 data path is routed — /minio (admin API + console) is EXPLICITLY
    #     EXCLUDED by !PathPrefix(`/minio`). The console (:9001) gains NO router.
    #   - Every successful op still requires a presigned URL minted by media-service
    #     after fa-auth authentication; no raw credentials cross the public interface.
    #   - passHostHeader: true on the backend is REQUIRED: GET SigV4 signatures bind
    #     the Host header, so the reverse proxy MUST forward the original Host unchanged
    #     for the signature to validate at MinIO.
    media-storage-router:
      entryPoints:
        - websecure
      # PRODUCTION: replace storage.example.com with your real storage FQDN.
      # The !PathPrefix(`/minio`) exclusion is the SECURITY CONTRACT and MUST stay regardless.
      rule: "Host(`storage.example.com`) && !PathPrefix(`/minio`)"
      service: minio-storage
      tls: {}

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth_user_service:8000"
    media-service:
      loadBalancer:
        servers:
          - url: "http://media_service:8000"
    minio-storage:
      loadBalancer:
        passHostHeader: true   # REQUIRED — GET SigV4 signs the Host; proxy MUST forward it unchanged
        servers:
          - url: "http://minio:9000"

  middlewares:
    ip-allowlist:
      IPAllowList:
        # Dashboard: localhost only (bridge gateway == host via SNAT). Sibling
        # containers and the LAN are not trusted. PRODUCTION: replace the gateway
        # below with your real management CIDR, or front the dashboard with auth.
        sourceRange:
          - "127.0.0.1/32"
          - "172.16.0.1/32"   # this stack's pinned bridge gateway == the Docker host
          - "::1/128"

    internal-only:
      IPAllowList:
        # Internal routes (health/metrics/private): host + sibling containers in this
        # stack's pinned subnet only — never the host's LAN.
        sourceRange:
          - "127.0.0.1/32"
          - "172.16.0.0/16"
          - "::1/128"

    security-headers-prod:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex,nofollow"
          Server: ""
          # Anti-clickjacking defense-in-depth alongside frameDeny. A
          # frame-ancestors-only policy does not restrict script/style/connect, so
          # it is safe to ship as a baseline; a full XSS-defense CSP belongs on the
          # HTML front end, not on these JSON APIs.
          Content-Security-Policy: "frame-ancestors 'none'"
        # ── HSTS — opt-in, public/production deployments only ────────────────────
        # WARNING: enabling HSTS instructs browsers to refuse all HTTP connections
        # to this host for stsSeconds — even after you disable it. Enable only when
        # TLS is correctly configured with a stable, trusted certificate and this
        # hostname will remain HTTPS-only for the full stsSeconds period.
        #stsSeconds: 31536000        # 1 year
        #stsIncludeSubdomains: true
        #stsPreload: false           # set true only after submitting to the HSTS preload list
