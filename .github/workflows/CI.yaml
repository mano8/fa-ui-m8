name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: app

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.18.0", "24.x"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.node-version == '22.18.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: app/coverage/lcov.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.18.0' && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: app/coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload coverage to Codacy
        if: matrix.node-version == '22.18.0' && github.actor != 'dependabot[bot]' && env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: app/coverage/lcov.info

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (HIGH/CRITICAL advisories)
        run: npm audit --audit-level=high

  compose-policy:
    name: Compose policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker_compose/compose_policy_tests
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check media_service image in compose files
        working-directory: docker_compose
        run: |
          for compose_file in dev_ui_m8/docker-compose.yml hardened_ui_m8/docker-compose.yml; do
            # Extract the media_service image and check if it uses media-service-m8
            service_image=$(sed -n '/^  media_service:/,/^  [^ ]/p' "$compose_file" | grep "image:" | head -1 | sed 's/.*image:[[:space:]]*//;s/[[:space:]]*$//')
            if [[ ! "$service_image" =~ tepochtli/media-service-m8 ]]; then
              echo "ERROR: $compose_file has media_service image '$service_image' (expected tepochtli/media-service-m8)"
              exit 1
            fi
            echo "✓ $compose_file: media_service uses $service_image"
          done

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install policy-test dependencies
        run: pip install pytest pytest-cov pyyaml

      - name: Run compose-policy tests
        run: pytest --tb=short --cov=. --cov-report=term-missing --cov-fail-under=100
