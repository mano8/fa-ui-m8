---
engines:
  eslint:
    enabled: true
  markdownlint:
    enabled: true
  lizard:
    exclude_paths:
      # Declarative JSX, configuration, generated, and compatibility files are
      # not useful function-complexity targets.
      - "app/astro.config.mjs"
      - "app/package-lock.json"
      - "app/scripts/**"
      - "app/src/components/auth/AccountApp.tsx"
      - "app/src/components/auth/OAuthCallback.tsx"
      - "app/src/components/fa-auth/account-crud.tsx"
      - "app/src/components/fa-auth/admin-users-panel.tsx"
      - "app/src/components/fa-auth/api-keys-panel.tsx"
      - "app/src/components/fa-auth/dashboard-overview.tsx"
      - "app/src/components/fa-auth/profile-panel.tsx"
      - "app/src/components/fa-auth/sessions-panel.tsx"
      - "app/src/components/fa-media/data-table-pagination.tsx"
      - "app/src/components/fa-media/data-table-toolbar.tsx"
      - "app/src/components/fa-media/media-dashboard-overview.tsx"
      - "app/src/components/fa-media/media-library.tsx"
      - "app/src/components/fa-media/media-presets.tsx"
      - "app/src/components/fa-prompt/prompt-block-editor.tsx"
      - "app/src/components/fa-prompt/prompt-template-editor.tsx"
      - "app/src/components/m8-ui/**"
      - "app/src/components/media/MediaApp.tsx"
      - "app/src/components/media/MediaPresetActionApp.tsx"
      - "app/src/components/prompt/PromptApp.tsx"
      - "app/src/components/ui/**"
      - "app/src/content/i18n/app/**"
      - "app/src/lib/prompt-stubs/**"
      - "app/src/lib/reparto-stubs/**"
      - "docker_compose/**/shared_migrations/**"
  prospector:
    exclude_paths:
      # Prospector's public-docstring rules do not apply to test modules, and
      # migration revisions are generated artifacts.
      - "docker_compose/compose_policy_tests/**"
      - "docker_compose/shared_live_tests/**"
      - "docker_compose/**/shared_migrations/**"
  stylelint:
    exclude_paths:
      # Codacy's current ruleset reports an unavailable SCSS rule for plain CSS.
      - "app/src/styles/global.css"
      - "app/src/styles/media.css"
      - "app/src/styles/prompt.css"

exclude_paths:
  - "app/coverage/**"
  - "app/dist/**"
  - "app/node_modules/**"
  - ".agents/**"
  - ".codex/**"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "REPOSITORY_CONTEXT.md"
